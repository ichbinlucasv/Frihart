[package]
name = "frihart-engine-servo"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
# Servo 0.7 needs Rust 1.88; the rest of the workspace stays at 1.85.
rust-version = "1.88"
description = "Servo Compat engine adapter (feature `servo`, off by default). See docs/ENGINE_HYBRID.md"
publish.workspace = true

[features]
default = []
# Campaign S. Pulls in Servo (crates.io, MPL-2.0, ~700 crates, SpiderMonkey
# through mozjs). Never part of the default build. Build and test with:
#   cargo test -p frihart-engine-servo --features servo
servo = ["dep:servo", "dep:url", "dep:dpi", "dep:frihart-net", "dep:frihart-blocker", "dep:rustls"]

[dependencies]
frihart-engine = { path = "../frihart-engine" }
frihart-core.workspace = true
frihart-gfx.workspace = true
# Pinned exactly: the embedding API is pre-1.0 and changes between releases.
# Off: clipboard, multiprocess (until the sandbox step), WebGL, WebGPU,
# WebXR, Bluetooth, gamepad, GStreamer media.
servo = { version = "=0.7.0", default-features = false, features = ["bundled", "js_jit"], optional = true }
url = { workspace = true, optional = true }
dpi = { version = "0.1", optional = true }
frihart-net = { workspace = true, optional = true }
frihart-blocker = { workspace = true, optional = true }
# Servo's TLS (aws-lc-rs) and frihart-net's (ring) both enable rustls
# providers, so the process default must be chosen explicitly: ring.
rustls = { version = "0.23.45", default-features = false, features = ["ring"], optional = true }

[[example]]
name = "servo_headless"
required-features = ["servo"]
