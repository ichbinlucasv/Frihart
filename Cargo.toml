[workspace]
resolver = "2"
members = [
    "crates/frihart",
    "crates/frihart-blocker",
    "crates/frihart-chrome",
    "crates/frihart-config",
    "crates/frihart-content",
    "crates/frihart-core",
    "crates/frihart-net",
    "crates/frihart-platform",
    "crates/frihart-privacy",
    "crates/frihart-profile",
    "crates/frihart-search",
    "crates/frihart-extensions",
    "crates/frihart-html",
    "crates/frihart-autofill",
    "crates/frihart-dom",
    "crates/frihart-css",
    "crates/frihart-style",
    "crates/frihart-layout",
    "crates/frihart-gfx",
    "crates/frihart-pipeline",
    "crates/frihart-forms",
    "crates/frihart-ipc",
    "crates/frihart-js",
    "crates/frihart-media",
    "crates/frihart-i18n",
    "crates/frihart-print",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Frihart contributors"]
rust-version = "1.85"
description = "A sovereign, privacy-first web browser"
publish = false

[workspace.dependencies]
frihart-blocker = { path = "crates/frihart-blocker" }
frihart-chrome = { path = "crates/frihart-chrome" }
frihart-config = { path = "crates/frihart-config" }
frihart-content = { path = "crates/frihart-content" }
frihart-core = { path = "crates/frihart-core" }
frihart-net = { path = "crates/frihart-net" }
frihart-platform = { path = "crates/frihart-platform" }
frihart-privacy = { path = "crates/frihart-privacy" }
frihart-profile = { path = "crates/frihart-profile" }
frihart-search = { path = "crates/frihart-search" }
frihart-extensions = { path = "crates/frihart-extensions" }
frihart-html = { path = "crates/frihart-html" }
frihart-autofill = { path = "crates/frihart-autofill" }
frihart-dom = { path = "crates/frihart-dom" }
frihart-css = { path = "crates/frihart-css" }
frihart-style = { path = "crates/frihart-style" }
frihart-layout = { path = "crates/frihart-layout" }
frihart-gfx = { path = "crates/frihart-gfx" }
frihart-pipeline = { path = "crates/frihart-pipeline" }
frihart-forms = { path = "crates/frihart-forms" }
frihart-ipc = { path = "crates/frihart-ipc" }
frihart-js = { path = "crates/frihart-js" }
frihart-media = { path = "crates/frihart-media" }
frihart-i18n = { path = "crates/frihart-i18n" }
frihart-print = { path = "crates/frihart-print" }

clap = { version = "4.5", features = ["derive"] }
cosmic-text = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
softbuffer = "0.4"
thiserror = "2.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2.5"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
winit = "0.30"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
